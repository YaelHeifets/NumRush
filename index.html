<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NumRush</title>
    <style>
    #gameDiv {
        display: none;
    }
    </style>
</head>
<body>

    <div id="startDiv">
        <h1>NumRush</h1>
        <button onclick="startNewGame()">Start Game</button>
    </div>

    <div id="gameDiv">
        <div id="numbersPanel"></div>
    </div>

    <script>
        let numbers = [];
        let sortedNumbers = [];
        let currentIndex = 0;

    function startNewGame() 
    {
        currentIndex = 0;
        document.getElementById("startDiv").style.display = "none";
        document.getElementById("gameDiv").style.display = "block";

        numbers = [];

        for (let i = 0; i < 10; i++) 
        {
            let num = Math.floor(Math.random() * 9000) + 1000;
            numbers.push(num);
        }

        sortedNumbers = [...numbers];
        sortedNumbers.sort(function(a, b) 
        {
            return a - b;
        });
        console.log("Original:", numbers);
        console.log("Sorted:", sortedNumbers);

        showNumbers();
    
    console.log(numbers);
    }

    function showNumbers() 
    {
        let panel = document.getElementById("numbersPanel");
        panel.innerHTML = "";

        for (let num of numbers) 
        {
            let btn = document.createElement("button");
            btn.innerHTML = num;
            btn.addEventListener("click", function () 
            {
                numberPressed(num, btn);
            });
            panel.appendChild(btn);
        }
    }

    function numberPressed(num, btn)
        {
            if (num === sortedNumbers[currentIndex]) 
                {
                    console.log("Correct!");
                    btn.style.backgroundColor = "lightgreen";
                    currentIndex++;
                }
                else 
                {
                    console.log("Wrong!");
                    btn.style.backgroundColor = "red";
                    playNote(293.66, 500);

                    setTimeout(function() {
                        btn.style.backgroundColor = "";
                    }, 500);
                 }        
        }
        function playNote(frequency = 440, duration = 1) {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = 'sine';
            oscillator.frequency.value = frequency;

            gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(
                0.0001,
                audioCtx.currentTime + duration / 1000
            );

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        }
    </script>

</body>
</html>
