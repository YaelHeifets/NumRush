<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NumRush</title>
    <style>
    #gameDiv {
        display: none;
    }
    </style>
</head>
<body>

    <div id="startDiv">
        <h1>NumRush</h1>
        <button onclick="startNewGame()">Start Game</button>
    </div>

    <div id="gameDiv">
        <div id="timePanel">Time: 0</div>
        <div id="bestTimePanel">Best Time: --</div>
        <div id="numbersPanel"></div>
        <button id="playAgainBtn" onclick="startNewGame()" style="display: none;">
            Play Again
        </button>
    </div>

    <script>
        let numbers = [];
        let sortedNumbers = [];
        let currentIndex = 0;
        let errorCount = 0;
        let gameOver = false;
        let startTime;
        let gameTime;
        let bestTime;

    function startNewGame() 
    {
        document.getElementById("playAgainBtn").style.display = "none";
        currentIndex = 0;
        errorCount = 0;
        gameOver = false;
        startTime = Date.now();
        updateTimer();

        console.log("Start time:", startTime);
        document.getElementById("timePanel").innerHTML = "Time: 0";
        document.getElementById("startDiv").style.display = "none";
        document.getElementById("gameDiv").style.display = "block";

        numbers = [];

        for (let i = 0; i < 10; i++) 
        {
            let num = Math.floor(Math.random() * 9000) + 1000;
            numbers.push(num);
        }

        sortedNumbers = [...numbers];
        sortedNumbers.sort(function(a, b) 
        {
            return a - b;
        });
        console.log("Original:", numbers);
        console.log("Sorted:", sortedNumbers);

        showNumbers();
    
    console.log(numbers);
    }

    function showNumbers() 
    {
        let panel = document.getElementById("numbersPanel");
        panel.innerHTML = "";

        for (let num of numbers) 
        {
            let btn = document.createElement("button");
            btn.innerHTML = num;
            btn.addEventListener("click", function () 
            {
                numberPressed(num, btn);
            });
            panel.appendChild(btn);
        }
    }

    function numberPressed(num, btn)
        {
            if (gameOver)
            {
                return;
            }

            console.log("Pressed:", num);
            console.log("Expected:", sortedNumbers[currentIndex]);
            
            if (num === sortedNumbers[currentIndex]) 
                {
                    console.log("Correct!");
                    btn.style.backgroundColor = "lightgreen";
                    currentIndex++;
                    if (currentIndex === numbers.length) 
                    {
                        endGame(true);
                    }
                }
                else 
                {
                    errorCount++;
                    console.log("Wrong!");
                    console.log("Errors:", errorCount);
                    btn.style.backgroundColor = "red";
                    playNote(293.66, 500);

                     if (errorCount >=3) 
                    {
                        setTimeout(function ()
                        {
                            endGame(false);
                        }, 500);
                    }

                    setTimeout(function() {
                        btn.style.backgroundColor = "";
                    }, 500);
                 }        
        }
    
    function endGame(win)
    {
        gameOver = true;
        document.getElementById("playAgainBtn").style.display = "block";
        gameTime = Date.now() - startTime;
        gameTime = gameTime / 1000;

        document.getElementById("timePanel").innerHTML =
            "Time: " + gameTime.toFixed(2) + " seconds";

        console.log("Game time:", gameTime);

        if (win)
        {
            if (bestTime === undefined || gameTime < bestTime)
            {
                bestTime = gameTime;

                document.getElementById("bestTimePanel").innerHTML =
                    "Best Time: " + bestTime.toFixed(2) + " seconds";
            }
            alert("You Won!");
        }
        else
        {
            alert("Game Over!");
        }
    }
        
    function playNote(frequency = 440, duration = 1) {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.type = 'sine';
        oscillator.frequency.value = frequency;

        gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(
            0.0001,
            audioCtx.currentTime + duration / 1000
        );

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.start();
        oscillator.stop(audioCtx.currentTime + duration);
        }

    function updateTimer()
    {
        if (gameOver) {
            return;
        }

        let currentTime = Date.now() - startTime;
        currentTime = currentTime / 1000;

        document.getElementById("timePanel").innerHTML =
            "Time: " + currentTime.toFixed(2) + " seconds";

        setTimeout(updateTimer, 100);
    }

    </script>

</body>
</html>
